<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE6D8">
<title>Montechiaro Guesser — learn your way around Vico Equense</title>
<meta name="description" content="A GeoGuessr-style game for the Sorrento peninsula around Montechiaro and Vico Equense: drop a pin, name the place, answer the route. Learn the area before you land.">
<meta name="robots" content="noindex">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
:root{
  --paper:#F3EEE3; --paper-warm:#EDE6D8; --ink:#22242A;
  --ink-soft:rgba(34,36,42,.62); --ink-faint:rgba(34,36,42,.22);
  --red:#9E3B32; --green:#3F7A5A; --blue:#2F5D8C;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper-warm);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
a{color:var(--blue)}

/* ---- shell --------------------------------------------------------- */
#app{display:flex;flex-direction:column;height:100%;min-height:100dvh}
header{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--ink-faint);background:var(--paper);
}
header h1{font-size:17px;letter-spacing:.2px}
header .sub{font-size:12px;color:var(--ink-soft)}
header .spacer{flex:1}
header .stat{font-family:var(--serif);font-size:15px;white-space:nowrap}
header .stat b{font-size:18px}
main{flex:1;position:relative;display:flex;min-height:0}

/* ---- map + panel --------------------------------------------------- */
#map{flex:1;min-height:260px;background:#cfd6cf}
#panel{
  width:370px;flex:0 0 370px;border-left:1px solid var(--ink-faint);
  background:var(--paper);overflow-y:auto;padding:16px 16px 28px;
}
@media (max-width:900px){
  main{flex-direction:column}
  #map{flex:0 0 42vh;min-height:180px}
  #panel{width:auto;flex:1 1 auto;border-left:none;border-top:1px solid var(--ink-faint)}
}

/* ---- bits ---------------------------------------------------------- */
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.card{border:1px solid var(--ink-faint);background:var(--paper);padding:14px;margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:6px}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.tip{border-left:3px solid var(--ink-faint);padding-left:10px;font-size:13.5px;color:var(--ink-soft)}

button{
  font:inherit;font-size:14px;color:var(--ink);background:var(--paper);
  border:1px solid var(--ink);padding:9px 14px;cursor:pointer;
  border-radius:2px;transition:background .12s;
}
button:hover:not(:disabled){background:var(--paper-warm)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--ink);color:var(--paper)}
button.primary:hover:not(:disabled){background:#000}
button.wide{display:block;width:100%;text-align:left;margin-bottom:8px}
button.ghost{border-color:var(--ink-faint);font-size:13px;padding:6px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}

.opt{display:block;width:100%;text-align:left;margin-bottom:8px;line-height:1.35}
.opt.right{border-color:var(--green);background:rgba(63,122,90,.12)}
.opt.wrong{border-color:var(--red);background:rgba(158,59,50,.10)}

.badge{
  display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--ink-faint);padding:1px 6px;margin-right:6px;vertical-align:1px;
}
.score-big{font-family:var(--serif);font-size:34px;line-height:1.1}
.dist{font-family:var(--serif);font-size:17px}

select,input[type=text]{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--ink-faint);background:var(--paper);color:var(--ink);border-radius:2px;width:100%}
label.f{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 4px}

ul.plain{list-style:none;margin:0;padding:0}
li.place{border-bottom:1px solid var(--ink-faint);padding:8px 0;cursor:pointer}
li.place:hover{background:rgba(34,36,42,.04)}
li.place .nm{font-family:var(--serif);font-size:15px}
li.place .ad{font-size:12px;color:var(--ink-soft)}

.pin{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);
  box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:12px;line-height:1;
}
.pin.guess{background:#22242A}
.pin.answer{background:var(--red)}
.leaflet-container{font-family:var(--sans)}

.hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
progress{width:100%;height:8px}
textarea{width:100%;height:130px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--ink-faint);background:var(--paper);color:var(--ink);padding:8px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:0}
hr{border:0;border-top:1px solid var(--ink-faint);margin:14px 0}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Montechiaro Guesser</h1>
    <span class="sub">Vico Equense &amp; the Sorrento peninsula</span>
    <span class="spacer"></span>
    <span class="stat" id="hud"></span>
    <button class="ghost" id="btn-home">Menu</button>
  </header>
  <main>
    <div id="map"></div>
    <div id="panel"></div>
  </main>
</div>

<script src="places.js"></script>
<script>
(function () {
'use strict';

const G = window.GEO;
const $ = sel => document.querySelector(sel);
const panel = $('#panel');
const hud = $('#hud');

/* ------------------------------------------------------------------ *
 * Stored state: coordinate corrections and best scores.
 * ------------------------------------------------------------------ */
const LS_COORDS = 'mg.coords.v1';
const LS_BEST   = 'mg.best.v1';
let overrides = load(LS_COORDS, {});
let best      = load(LS_BEST, {});

function load(k, dflt) {
  try { return JSON.parse(localStorage.getItem(k)) || dflt; } catch (e) { return dflt; }
}
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

const byId = Object.fromEntries(G.places.map(p => [p.id, p]));
function pos(p) { return overrides[p.id] || [p.lat, p.lon]; }
function isFixed(p) { return !!overrides[p.id] || p.src === 'cited'; }

/* Great-circle distance in metres. */
function metres(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function prettyDistance(m) {
  return m < 950 ? Math.round(m) + ' m' : (m / 1000).toFixed(m < 9500 ? 2 : 1) + ' km';
}

/* Everything here is within a few kilometres, so the curve has to be much
 * steeper than the world-scale original: 5000 at the door, half of it 350 m
 * away, near nothing by the time you are in the next village. */
const PERFECT_M = 40;
function scoreFor(m) {
  if (m <= PERFECT_M) return 5000;
  return Math.max(0, Math.round(5000 * Math.exp(-(m - PERFECT_M) / 500)));
}
const MAX_ROUND = 5000;

/* ------------------------------------------------------------------ *
 * Map. One instance, two basemaps: unlabelled imagery while you are
 * guessing, the labelled street map for the reveal.
 * ------------------------------------------------------------------ */
const map = L.map('map', { zoomControl: true, attributionControl: true })
             .setView(G.centre, 13);

const imagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 18, attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics' });

const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' });

let baseNow = null;
function base(layer) {
  if (baseNow === layer) return;
  if (baseNow) map.removeLayer(baseNow);
  layer.addTo(map);
  baseNow = layer;
}
base(imagery);

const drawn = L.layerGroup().addTo(map);
function clearMap() { drawn.clearLayers(); }

function dot(latlng, kind, glyph, opts) {
  return L.marker(latlng, Object.assign({
    icon: L.divIcon({
      className: '',
      html: '<div class="pin ' + kind + '"' +
            (opts && opts.colour ? ' style="background:' + opts.colour + '"' : '') +
            '>' + (glyph || '') + '</div>',
      iconSize: [22, 22], iconAnchor: [11, 11]
    })
  }, opts || {}));
}

/* ------------------------------------------------------------------ *
 * Game state.
 * ------------------------------------------------------------------ */
let game = null;   // { mode, rounds:[], i, score, results:[] }
let round = null;  // per-round working state

/* The pin round is the only thing that listens for map clicks. Leaving the
 * listener attached after the player walks out of the round — Menu, Study —
 * means the next click on the map runs a round that is no longer on screen. */
let detachPin = () => {};

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sample(a, n) { return shuffle(a).slice(0, n); }

const MODES = {
  pin:   { name: 'Drop the pin', rounds: 10,
           blurb: 'You are told what the place is. Click the map where you think it stands. Scored on how close you get.' },
  name:  { name: 'Name that spot', rounds: 10,
           blurb: 'A pin lands on the satellite map. Work out from the ground what it is.' },
  route: { name: 'Getting around', rounds: 10,
           blurb: 'Buses, trains, boats and which beach you can actually walk to. No map, just the practical stuff.' },
  mixed: { name: 'Full tour', rounds: 12,
           blurb: 'Six pins, three spots to name, three route questions. The one to play the night before you fly.' }
};

function buildRounds(mode, cat) {
  const pool = cat && cat !== 'all' ? G.places.filter(p => p.cat === cat) : G.places;
  const pin  = n => sample(pool, Math.min(n, pool.length)).map(p => ({ type: 'pin', place: p }));
  const nam  = n => sample(pool, Math.min(n, pool.length)).map(p => ({ type: 'name', place: p }));
  const rte  = n => sample(G.quiz, Math.min(n, G.quiz.length)).map(q => ({ type: 'route', q }));
  if (mode === 'pin')   return pin(MODES.pin.rounds);
  if (mode === 'name')  return nam(MODES.name.rounds);
  if (mode === 'route') return rte(MODES.route.rounds);
  return shuffle([].concat(pin(6), nam(3), rte(3)));
}

function startGame(mode, cat) {
  game = { mode, cat, rounds: buildRounds(mode, cat), i: 0, score: 0, results: [] };
  nextRound();
}

function nextRound() {
  if (game.i >= game.rounds.length) return showSummary();
  const r = game.rounds[game.i];
  if (r.type === 'pin')   return roundPin(r);
  if (r.type === 'name')  return roundName(r);
  if (r.type === 'route') return roundRoute(r);
}

function setHud() {
  if (!game) { hud.textContent = ''; return; }
  hud.innerHTML = 'Round ' + Math.min(game.i + 1, game.rounds.length) + '/' + game.rounds.length +
                  ' &nbsp;·&nbsp; <b>' + game.score.toLocaleString() + '</b>';
}

/* ------------------------------------------------------------------ *
 * Round: drop the pin.
 * ------------------------------------------------------------------ */
function roundPin(r) {
  const p = r.place;
  detachPin();
  round = { guess: null, marker: null, done: false };
  clearMap();
  base(imagery);
  map.setView(G.centre, 13);
  setHud();

  panel.innerHTML =
    '<div class="kicker">Drop the pin</div>' +
    '<div class="card">' +
      '<h2>' + esc(p.name) + '</h2>' +
      '<p><span class="badge">' + G.categories[p.cat].label + '</span></p>' +
      '<p>' + esc(p.clue) + '</p>' +
    '</div>' +
    '<p class="small muted">Click the map to place your pin. Drag it to adjust.</p>' +
    '<button class="primary" id="lock" disabled>Lock it in</button>' +
    '<p class="hint">The imagery has no labels — read the coastline, the ravines and the roads.</p>';

  $('#lock').onclick = () => revealPin(p);

  map.on('click', onClick);
  function onClick(e) {
    if (round.done || !$('#lock')) return;
    if (!round.marker) {
      round.marker = dot(e.latlng, 'guess', '✕', { draggable: true }).addTo(drawn);
      round.marker.on('dragend', () => { round.guess = round.marker.getLatLng(); });
    } else {
      round.marker.setLatLng(e.latlng);
    }
    round.guess = e.latlng;
    $('#lock').disabled = false;
  }
  detachPin = round.off = () => { map.off('click', onClick); detachPin = () => {}; };
}

function revealPin(p) {
  round.done = true;
  round.off();
  const truth = pos(p);
  const guess = [round.guess.lat, round.guess.lng];
  const d = metres(guess, truth);
  const pts = scoreFor(d);
  game.score += pts;
  game.results.push({ type: 'pin', place: p, d, pts });

  base(streets);
  clearMap();
  dot(guess, 'guess', '✕').addTo(drawn).bindTooltip('Your guess');
  dot(truth, 'answer', G.categories[p.cat].glyph, { colour: G.categories[p.cat].colour })
    .addTo(drawn).bindTooltip(p.name, { permanent: true, direction: 'top' });
  L.polyline([guess, truth], { color: '#22242A', weight: 2, dashArray: '5,5' }).addTo(drawn);
  map.fitBounds(L.latLngBounds([guess, truth]).pad(0.35), { maxZoom: 16 });

  panel.innerHTML =
    '<div class="kicker">' + (d < 150 ? 'Nailed it' : d < 600 ? 'Close' : d < 2000 ? 'Out by a bit' : 'Wrong side of the hill') + '</div>' +
    '<div class="card">' +
      '<div class="score-big">' + pts.toLocaleString() + '<span class="muted small"> / 5,000</span></div>' +
      '<p class="dist">' + prettyDistance(d) + ' away</p>' +
      '<h2 style="margin-top:10px">' + esc(p.name) + '</h2>' +
      (p.addr ? '<p class="small muted">' + esc(p.addr) + '</p>' : '') +
      '<p class="tip">' + esc(p.tip) + '</p>' +
      accuracyNote(p) +
    '</div>' +
    '<button class="primary" id="next">' + (game.i + 1 >= game.rounds.length ? 'See the result' : 'Next round') + '</button>';
  $('#next').onclick = () => { game.i++; nextRound(); };
  setHud();
}

/* ------------------------------------------------------------------ *
 * Round: name that spot.
 * ------------------------------------------------------------------ */
function roundName(r) {
  const p = r.place;
  const wrong = sample(G.places.filter(x => x.id !== p.id), 3);
  const options = shuffle([p].concat(wrong));
  clearMap();
  base(imagery);
  map.setView(pos(p), 16);
  dot(pos(p), 'answer', '?').addTo(drawn);
  setHud();

  panel.innerHTML =
    '<div class="kicker">Name that spot</div>' +
    '<div class="card"><p>The pin is on the map. What is it — or what is it next to?</p></div>' +
    options.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o.name) + '</button>').join('') +
    '<p class="hint">Zoom out if you need to see where you are.</p>';

  panel.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const chosen = options[+btn.dataset.i];
      const ok = chosen.id === p.id;
      const pts = ok ? MAX_ROUND : 0;
      game.score += pts;
      game.results.push({ type: 'name', place: p, ok, pts });
      panel.querySelectorAll('.opt').forEach((b, i) => {
        b.disabled = true;
        if (options[i].id === p.id) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
      });
      base(streets);
      panel.insertAdjacentHTML('beforeend',
        '<div class="card" style="margin-top:12px">' +
          '<h2>' + esc(p.name) + '</h2>' +
          (p.addr ? '<p class="small muted">' + esc(p.addr) + '</p>' : '') +
          '<p class="tip">' + esc(p.tip) + '</p>' + accuracyNote(p) +
        '</div>' +
        '<button class="primary" id="next">' + (game.i + 1 >= game.rounds.length ? 'See the result' : 'Next round') + '</button>');
      $('#next').onclick = () => { game.i++; nextRound(); };
      setHud();
    };
  });
}

/* ------------------------------------------------------------------ *
 * Round: getting around.
 * ------------------------------------------------------------------ */
function roundRoute(r) {
  const q = r.q;
  const correct = q.options[0];
  const options = shuffle(q.options);
  clearMap();
  base(streets);
  map.setView(G.centre, 12);
  setHud();

  panel.innerHTML =
    '<div class="kicker">Getting around</div>' +
    '<div class="card"><p>' + esc(q.q) + '</p></div>' +
    options.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('');

  panel.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const ok = options[+btn.dataset.i] === correct;
      const pts = ok ? MAX_ROUND : 0;
      game.score += pts;
      game.results.push({ type: 'route', q, ok, pts });
      panel.querySelectorAll('.opt').forEach((b, i) => {
        b.disabled = true;
        if (options[i] === correct) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
      });
      panel.insertAdjacentHTML('beforeend',
        '<div class="card" style="margin-top:12px"><p class="tip">' + esc(q.why) + '</p></div>' +
        '<button class="primary" id="next">' + (game.i + 1 >= game.rounds.length ? 'See the result' : 'Next round') + '</button>');
      $('#next').onclick = () => { game.i++; nextRound(); };
      setHud();
    };
  });
}

/* ------------------------------------------------------------------ *
 * Summary.
 * ------------------------------------------------------------------ */
function showSummary() {
  detachPin();
  const max = game.rounds.length * MAX_ROUND;
  const key = game.mode + (game.cat && game.cat !== 'all' ? ':' + game.cat : '');
  const prev = best[key] || 0;
  const isBest = game.score > prev;
  if (isBest) { best[key] = game.score; save(LS_BEST, best); }

  clearMap();
  base(streets);
  const pins = [];
  game.results.forEach(res => {
    if (res.place) {
      const ll = pos(res.place);
      pins.push(ll);
      dot(ll, 'answer', G.categories[res.place.cat].glyph, { colour: G.categories[res.place.cat].colour })
        .addTo(drawn).bindTooltip(res.place.name);
    }
  });
  if (pins.length) map.fitBounds(L.latLngBounds(pins).pad(0.25), { maxZoom: 15 });

  const rows = game.results.map(res => {
    const label = res.place ? res.place.name : res.q.q;
    const detail = res.type === 'pin' ? prettyDistance(res.d) : (res.ok ? 'correct' : 'missed');
    return '<li class="place"><div class="nm">' + esc(label.length > 64 ? label.slice(0, 61) + '…' : label) + '</div>' +
           '<div class="ad">' + detail + ' &nbsp;·&nbsp; ' + res.pts.toLocaleString() + ' pts</div></li>';
  }).join('');

  hud.innerHTML = '<b>' + game.score.toLocaleString() + '</b> / ' + max.toLocaleString();

  panel.innerHTML =
    '<div class="kicker">' + MODES[game.mode].name + ' — done</div>' +
    '<div class="card">' +
      '<div class="score-big">' + game.score.toLocaleString() + '<span class="muted small"> / ' + max.toLocaleString() + '</span></div>' +
      '<p class="small muted">' + Math.round(100 * game.score / max) + '% &nbsp;·&nbsp; best ' + Math.max(prev, game.score).toLocaleString() +
      (isBest ? ' &nbsp;·&nbsp; <b>new best</b>' : '') + '</p>' +
    '</div>' +
    '<div class="row"><button class="primary" id="again">Play again</button>' +
    '<button id="share">Copy result</button>' +
    '<button id="menu2">Menu</button></div>' +
    '<hr><ul class="plain">' + rows + '</ul>';

  $('#again').onclick = () => startGame(game.mode, game.cat);
  $('#menu2').onclick = showHome;
  $('#share').onclick = () => {
    const bars = game.results.map(res => {
      const f = res.pts / MAX_ROUND;
      return f >= .95 ? '🟩' : f >= .6 ? '🟨' : f >= .25 ? '🟧' : '⬜';
    }).join('');
    const text = 'Montechiaro Guesser — ' + MODES[game.mode].name + '\n' +
                 game.score.toLocaleString() + '/' + max.toLocaleString() + '\n' + bars;
    copy(text, $('#share'));
  };
}

function copy(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = t, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }
}

/* ------------------------------------------------------------------ *
 * Home.
 * ------------------------------------------------------------------ */
function showHome() {
  detachPin();
  game = null; round = null;
  hud.textContent = '';
  clearMap();
  base(streets);
  map.setView(G.centre, 13);
  G.places.forEach(p => {
    dot(pos(p), 'answer', G.categories[p.cat].glyph, { colour: G.categories[p.cat].colour })
      .addTo(drawn).bindTooltip(p.name);
  });

  const cats = ['all'].concat(Object.keys(G.categories));
  panel.innerHTML =
    '<div class="kicker">Learn the ground before you land</div>' +
    '<div class="card">' +
      '<h2>Montechiaro Guesser</h2>' +
      '<p class="small">' + G.places.length + ' places around Vico Equense: your guesthouse, the stations and bus stops, ' +
      'somewhere to eat, somewhere to buy food, and every way down to the water.</p>' +
    '</div>' +
    Object.keys(MODES).map(m =>
      '<button class="wide" data-mode="' + m + '"><b>' + MODES[m].name + '</b><br>' +
      '<span class="small muted">' + MODES[m].blurb + '</span>' +
      (best[m] ? '<br><span class="small muted">best ' + best[m].toLocaleString() + '</span>' : '') +
      '</button>').join('') +
    '<hr>' +
    '<label class="f">Limit the pin rounds to</label>' +
    '<select id="cat">' + cats.map(c =>
      '<option value="' + c + '">' + (c === 'all' ? 'Everything' : G.categories[c].label + ' only') + '</option>').join('') +
    '</select>' +
    '<hr>' +
    '<button class="wide" id="study"><b>Study the map</b><br><span class="small muted">Browse every place, read the notes, and correct the coordinates.</span></button>' +
    '<p class="hint">Positions marked &ldquo;approx&rdquo; are estimates. Study mode can pull the real ones from OpenStreetMap in about half a minute.</p>';

  panel.querySelectorAll('[data-mode]').forEach(b => {
    b.onclick = () => startGame(b.dataset.mode, $('#cat').value);
  });
  $('#study').onclick = () => showStudy('all');
}

/* ------------------------------------------------------------------ *
 * Study mode: browse, correct, sync.
 * ------------------------------------------------------------------ */
let calibrating = false;

function showStudy(filter) {
  detachPin();
  game = null;
  hud.textContent = '';
  clearMap();
  base(streets);
  const shown = filter && filter !== 'all' ? G.places.filter(p => p.cat === filter) : G.places;
  const markers = {};

  shown.forEach(p => {
    const m = dot(pos(p), 'answer', G.categories[p.cat].glyph,
                  { colour: G.categories[p.cat].colour, draggable: calibrating }).addTo(drawn);
    m.bindTooltip(p.name);
    m.on('dragend', () => {
      const ll = m.getLatLng();
      overrides[p.id] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6)];
      save(LS_COORDS, overrides);
      showStudy(filter);
    });
    markers[p.id] = m;
  });
  const all = shown.map(pos);
  if (all.length) map.fitBounds(L.latLngBounds(all).pad(0.15), { maxZoom: 15 });

  const cats = ['all'].concat(Object.keys(G.categories));
  const nApprox = G.places.filter(p => !isFixed(p)).length;

  panel.innerHTML =
    '<div class="kicker">Study the map</div>' +
    '<label class="f">Show</label>' +
    '<select id="f">' + cats.map(c =>
      '<option value="' + c + '"' + (c === (filter || 'all') ? ' selected' : '') + '>' +
      (c === 'all' ? 'Everything (' + G.places.length + ')' : G.categories[c].label) + '</option>').join('') +
    '</select>' +
    '<div class="legend">' + Object.keys(G.categories).map(c =>
      '<span><i style="background:' + G.categories[c].colour + '"></i>' + G.categories[c].label + '</span>').join('') + '</div>' +
    '<hr>' +
    '<div class="card">' +
      '<p class="small"><b>' + nApprox + '</b> of ' + G.places.length + ' positions are still estimates.</p>' +
      '<div class="row">' +
        '<button id="sync">Sync with OpenStreetMap</button>' +
        '<button class="ghost" id="calib">' + (calibrating ? 'Stop dragging' : 'Drag to correct') + '</button>' +
      '</div>' +
      '<div id="syncout"></div>' +
      '<p class="hint">The sync geocodes each entry through Nominatim, one request a second, straight from this browser. ' +
      'Anything it puts more than ' + G.sanityRadiusKm + ' km from Vico Equense is treated as a bad match and ignored. ' +
      'Corrections are stored on this device only.</p>' +
      (Object.keys(overrides).length
        ? '<div class="row" style="margin-top:8px"><button class="ghost" id="exp">Export corrections</button>' +
          '<button class="ghost" id="reset">Reset all</button></div>'
        : '') +
    '</div>' +
    '<ul class="plain">' + shown.map(p =>
      '<li class="place" data-id="' + p.id + '">' +
        '<div class="nm">' + esc(p.name) + (isFixed(p) ? '' : ' <span class="badge">approx</span>') + '</div>' +
        '<div class="ad">' + G.categories[p.cat].label + (p.addr ? ' · ' + esc(p.addr) : '') + '</div>' +
      '</li>').join('') + '</ul>';

  $('#f').onchange = e => showStudy(e.target.value);
  $('#calib').onclick = () => { calibrating = !calibrating; showStudy(filter); };
  $('#sync').onclick = () => runSync(filter);
  if ($('#exp')) $('#exp').onclick = () => {
    panel.insertAdjacentHTML('afterbegin',
      '<p class="small muted">Paste these into places.js to make them permanent.</p>' +
      '<textarea readonly>' + esc(JSON.stringify(overrides, null, 2)) + '</textarea>');
  };
  if ($('#reset')) $('#reset').onclick = () => {
    if (confirm('Discard every coordinate correction on this device?')) {
      overrides = {}; save(LS_COORDS, overrides); showStudy(filter);
    }
  };

  panel.querySelectorAll('li.place').forEach(li => {
    li.onclick = () => {
      const p = byId[li.dataset.id];
      map.setView(pos(p), 17);
      const m = markers[p.id];
      if (m) m.openTooltip();
      panel.insertAdjacentHTML('afterbegin',
        '<div class="card"><h2>' + esc(p.name) + '</h2>' +
        (p.addr ? '<p class="small muted">' + esc(p.addr) + '</p>' : '') +
        '<p class="small">' + esc(p.clue) + '</p>' +
        '<p class="tip">' + esc(p.tip) + '</p>' + accuracyNote(p) +
        '<p class="small"><a target="_blank" rel="noreferrer" href="https://www.openstreetmap.org/search?query=' +
          encodeURIComponent(p.q) + '">Check it on OpenStreetMap</a></p></div>');
      panel.scrollTop = 0;
    };
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function runSync(filter) {
  const out = $('#syncout');
  const btn = $('#sync');
  btn.disabled = true;
  let ok = 0, rejected = 0, missing = 0, failed = 0;
  const total = G.places.length;

  for (let i = 0; i < total; i++) {
    const p = G.places[i];
    out.innerHTML = '<progress max="' + total + '" value="' + i + '"></progress>' +
                    '<p class="small muted">' + (i + 1) + ' / ' + total + ' — ' + esc(p.name) + '</p>';
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(p.q);
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      const j = await res.json();
      if (j && j.length) {
        const ll = [+j[0].lat, +j[0].lon];
        if (metres(ll, G.centre) <= G.sanityRadiusKm * 1000) {
          overrides[p.id] = [+ll[0].toFixed(6), +ll[1].toFixed(6)];
          ok++;
        } else rejected++;
      } else missing++;
    } catch (e) { failed++; }
    if (i < total - 1) await sleep(1100);
  }
  save(LS_COORDS, overrides);
  out.innerHTML = '<p class="small"><b>' + ok + '</b> positioned from OpenStreetMap' +
    (missing ? ', ' + missing + ' not found' : '') +
    (rejected ? ', ' + rejected + ' rejected as bad matches' : '') +
    (failed ? ', ' + failed + ' failed (network blocked?)' : '') + '.</p>';
  await sleep(900);
  showStudy(filter);
}

/* ------------------------------------------------------------------ */
function accuracyNote(p) {
  return isFixed(p) ? '' :
    '<p class="small muted">Position is an estimate — run the OpenStreetMap sync in Study mode to pin it exactly.</p>';
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

$('#btn-home').onclick = showHome;
showHome();

/* Leaflet needs a nudge when the panel changes the layout on small screens. */
window.addEventListener('resize', () => map.invalidateSize());
setTimeout(() => map.invalidateSize(), 100);

})();
</script>
